services:
  - type: web
    name: chatgpt-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./chatgpt_platform.db
      - key: GOOGLE_CLIENT_ID
        value: 373507110593-21imdi81bndguj604ntev9pvt5i6e37t.apps.googleusercontent.com
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: DEFAULT_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
